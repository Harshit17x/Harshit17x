<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-labelledby="title"><title id="title">Night scene. see you around</title>
<style>@font-face{font-family:'Dither Caps';src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'Dither Mono',ui-monospace,monospace;fill:#2a2208}
.caps{font-family:'Dither Caps',monospace;font-size:16px;letter-spacing:4px}
.small{font-size:8px;letter-spacing:2px}
.dim{fill:#7d6f45}
.accent{fill:#a88400}
.px{image-rendering:crisp-edges;image-rendering:pixelated}
.star{fill:#3a2e00;transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/><feFlood flood-color="#a88400"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<image class="px" image-rendering="optimizeSpeed" width="880" height="220" href="data:image/png;base64," />
<g filter="url(#glow)" shape-rendering="crispEdges"><path fill="#3a2e00" d="M72 28h12v4h-12zM68 32h8v4h-8zM64 36h8v4h-8zM64 40h8v4h-8zM64 44h8v4h-8zM68 48h8v4h-8zM72 52h12v4h-12z"/>
<g transform="translate(628 32)"><path class="star" style="animation-duration:3.4s;animation-delay:0s" d="M12 0h4v4h-4zM12 4h4v4h-4zM8 8h12v4h-12zM0 12h28v4h-28zM8 16h12v4h-12zM12 20h4v4h-4zM12 24h4v4h-4z"/></g>
<g transform="translate(756 24)"><path class="star" style="animation-duration:2.7s;animation-delay:-1.1s" d="M4 0h4v4h-4zM0 4h12v4h-12zM4 8h4v4h-4z"/></g>
<g transform="translate(296 52)"><path class="star" style="animation-duration:3.9s;animation-delay:-2s" d="M4 0h4v4h-4zM0 4h12v4h-12zM4 8h4v4h-4z"/></g>
</g>
<text class="caps small" x="36" y="206" fill="#f5f1e6" style="fill:#f5f1e6">HARSHIT · 2026</text>
<text class="caps small" x="844" y="206" text-anchor="end" style="fill:#f5f1e6">SEE YOU AROUND</text>
</svg>
