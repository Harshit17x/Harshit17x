<svg xmlns="http://www.w3.org/2000/svg" width="440" height="312" viewBox="0 0 440 312" role="img" aria-labelledby="title"><title id="title">Nitro-Drift: project</title>
<style>@font-face{font-family:'Dither Mono';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Dither Caps';src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'Dither Mono',ui-monospace,monospace;fill:#2a2208}
.caps{font-family:'Dither Caps',monospace;font-size:16px;letter-spacing:4px}
.small{font-size:8px;letter-spacing:2px}
.dim{fill:#7d6f45}
.accent{fill:#a88400}
.px{image-rendering:crisp-edges;image-rendering:pixelated}
.star{fill:#3a2e00;transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
