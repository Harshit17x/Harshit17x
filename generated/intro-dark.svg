<svg xmlns="http://www.w3.org/2000/svg" width="880" height="160" viewBox="0 0 880 160" role="img" aria-labelledby="title"><title id="title">I build local-first tools and small games. Lately: pixels, dithering and quiet, fast software.</title>
<style>@font-face{font-family:'Dither Mono';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Dither Caps';src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'Dither Mono',ui-monospace,monospace;fill:#f6ecc9}
