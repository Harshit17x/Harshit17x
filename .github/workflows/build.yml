name: Build profile

on:
  schedule:
    - cron: '17 3 * * *' # daily, refreshes contributions and stats
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['profile.config.json', 'assets/**', 'scripts/**', 'package.json', 'package-lock.json']

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check
      # Commits made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md generated data/cache.json
          git diff --cached --quiet || (git commit -m "chore: rebuild profile" && git push)
